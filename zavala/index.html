<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Zavala Properties Management — Client Dashboard | UpneX</title>
<style>
  :root{
    --navy:#1a2e4a;
    --navy-deep:#11203a;
    --blue:#0066cc;
    --blue-light:#3d8bff;
    --green:#1faa59;
    --amber:#e0951b;
    --red:#c0392b;
    --grey:#7b8aa0;
    --ink:#1a2233;
    --line:#e5eaf2;
    --bg:#f4f7fc;
    --p-design:#7c4dff; --p-dev:#0066cc; --p-test:#e0951b; --p-deploy:#14a0a0;
    --p-prod:#1faa59; --p-maint:#7b8aa0; --p-update:#3d8bff; --p-upgrade:#4a3ec9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  }

  /* ---------- PIN LOCK ---------- */
  #lock{
    position:fixed;inset:0;z-index:1000;
    background:radial-gradient(circle at 50% 30%, #234066 0%, var(--navy) 45%, var(--navy-deep) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;padding:24px;text-align:center;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #lock.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .lock-logo{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
  .lock-logo span{color:var(--blue-light)}
  .lock-sub{color:#9fb3d1;font-size:14px;margin-bottom:38px;letter-spacing:.3px}
  .lock-icon{width:58px;height:58px;border-radius:16px;margin-bottom:22px;background:rgba(61,139,255,.14);border:1px solid rgba(61,139,255,.35);display:flex;align-items:center;justify-content:center;font-size:26px}
  .lock-title{font-size:19px;font-weight:600;margin-bottom:6px}
  .lock-hint{color:#8fa4c4;font-size:13px;margin-bottom:26px}
  .pin-row{display:flex;gap:10px;margin-bottom:18px}
  .pin-box{width:46px;height:56px;border-radius:12px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);color:#fff;font-size:24px;font-weight:700;text-align:center;transition:border-color .15s,background .15s,transform .15s;outline:none;-moz-appearance:textfield}
  .pin-box::-webkit-outer-spin-button,.pin-box::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pin-box:focus{border-color:var(--blue-light);background:rgba(61,139,255,.12);transform:translateY(-2px)}
  .pin-box.filled{border-color:rgba(61,139,255,.6)}
  .pin-err{color:#ff7b7b;font-size:13.5px;height:18px;opacity:0;transition:opacity .2s}
  .pin-err.show{opacity:1}
  .pin-row.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .lock-foot{position:absolute;bottom:26px;color:#6f86a8;font-size:12px}

  /* ---------- DASHBOARD ---------- */
  #app{opacity:0;transition:opacity .7s ease}
  #app.show{opacity:1}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header.top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;padding:28px 0 0}
  .brand{font-size:25px;font-weight:800;letter-spacing:-.6px}
  .brand .x{color:#7fa8d8;font-weight:500;margin:0 8px;font-size:20px}
  .brand .raut{color:#fff;font-weight:700}
  .top-sub{color:#a9bdda;font-size:14.5px;margin-top:6px}
  .top-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;align-items:center}
  .meta-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#cbd9ee;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:20px}
  .meta-chip b{color:#fff;font-weight:600}

  /* ---------- TABS ---------- */
  .tab-bar{display:flex;gap:0;margin-top:22px;border-bottom:none}
  .tab-btn{
    padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;
    border:none;background:rgba(255,255,255,.07);color:#9fb3d1;
    border-radius:10px 10px 0 0;margin-right:4px;
    transition:background .15s,color .15s;letter-spacing:.2px;
  }
  .tab-btn:hover{background:rgba(255,255,255,.12);color:#fff}
  .tab-btn.active{background:#f4f7fc;color:var(--navy)}

  /* ---------- TAB PANELS ---------- */
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  /* ---------- STATS ROW ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-4px}
  .stat{background:#fff;border-radius:14px;padding:20px 18px;box-shadow:0 8px 24px rgba(26,46,74,.08);border:1px solid var(--line)}
  .stat .n{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
  .stat .l{font-size:12.5px;color:var(--grey);margin-top:8px;font-weight:500}
  .stat.accent .n{color:var(--blue)}
  .stat.green .n{color:var(--green)}

  /* ---------- PORTFOLIO METRICS ---------- */
  .port-section{margin:36px 0 0}
  .port-head{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .port-sub{font-size:13px;color:var(--grey);margin-bottom:18px}
  .metric-grid{display:grid;gap:14px}
  .mg-3{grid-template-columns:repeat(3,1fr)}
  .mg-4{grid-template-columns:repeat(4,1fr)}
  .mg-5{grid-template-columns:repeat(5,1fr)}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;box-shadow:0 3px 12px rgba(26,46,74,.05)}
  .mcard .mv{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
  .mcard .ml{font-size:12px;color:var(--grey);margin-top:7px;font-weight:500}
  .mcard .ms{font-size:11px;color:var(--grey);margin-top:4px}
  .mcard.accent .mv{color:var(--blue)}
  .mcard.green .mv{color:var(--green)}
  .mcard.amber .mv{color:var(--amber)}
  .mcard.red .mv{color:var(--red)}

  .prog-wrap{margin-top:14px}
  .prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
  .prog-label span{color:var(--grey)}
  .prog-bar{height:8px;background:#e7ebf2;border-radius:4px;overflow:hidden}
  .prog-fill{height:100%;border-radius:4px;transition:width .5s ease}

  .twin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .big-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px;box-shadow:0 3px 12px rgba(26,46,74,.05)}
  .big-card h4{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:16px}
  .kv-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv-row:last-child{border-bottom:none}
  .kv-row .kv-k{color:var(--grey)}
  .kv-row .kv-v{font-weight:700;color:var(--ink)}
  .kv-row .kv-v.pos{color:var(--green)}
  .kv-row .kv-v.neg{color:var(--red)}
  .kv-row .kv-v.warn{color:var(--amber)}

  .stale-banner{display:none;background:#fff8e6;border:1px solid #f0c040;border-radius:10px;padding:10px 16px;font-size:12.5px;color:#7a5a00;margin:16px 0 0;align-items:center;gap:8px}
  .stale-banner.show{display:flex}

  /* ---------- SECTION HEADERS (Agents tab) ---------- */
  .sec-head{display:flex;align-items:center;gap:10px;margin:38px 0 5px;font-size:17px;font-weight:800;color:var(--navy)}
  .sec-sub{font-size:13px;color:var(--grey);margin-bottom:18px;line-height:1.5}

  /* ---------- KANBAN ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#3a4658;background:#fff;border:1px solid var(--line);padding:5px 11px;border-radius:20px}
  .lg .sw{width:10px;height:10px;border-radius:50%}
  .kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start}
  .col{background:#eef2f8;border:1px solid var(--line);border-radius:14px;padding:12px 12px 16px;min-height:120px}
  .col.live{background:#eafaf0;border-color:#c9ead6}
  .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 3px}
  .col-title{font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
  .col-count{font-size:11px;font-weight:700;color:var(--grey);background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;box-shadow:0 2px 8px rgba(26,46,74,.05);margin-bottom:11px}
  .kcard:last-child{margin-bottom:0}
  .kc-name{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.25}
  .kc-dom{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:5px;margin-top:6px;text-transform:uppercase}
  .d-tenant{color:#0a66c2;background:#e7f1ff}.d-owner{color:#7a3eb5;background:#f1e8fb}
  .d-lease{color:#0f7a3d;background:#e3f7ec}.d-fin{color:#3a4a8a;background:#e8ebfb}
  .d-ops{color:#b5532e;background:#fbe9e1}.d-lead{color:#1a8a8a;background:#e0f7f7}
  .kc-desc{font-size:11.5px;color:#5a6678;line-height:1.4;margin-top:8px}
  .track{display:flex;gap:3px;margin-top:11px}
  .track .t{flex:1;height:5px;border-radius:3px;background:#e7ebf2}
  .kc-when{font-size:10.5px;font-weight:700;color:var(--grey);margin-top:9px;display:flex;align-items:center;gap:5px}
  .kc-when .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

  /* ---------- CALENDAR ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .month{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:0 2px 8px rgba(26,46,74,.05)}
  .month.planned{background:#fbfcfe;border-style:dashed}
  .m-name{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .month.planned .m-name{color:var(--grey)}
  .m-tag{font-size:9.5px;font-weight:700;color:var(--grey)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
  .dow span{font-size:8.5px;font-weight:700;color:var(--grey);text-align:center}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .day{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#8a96a8}
  .day.mark{color:#fff;font-weight:800}
  .day.today{outline:2px solid var(--navy);outline-offset:-2px;border-radius:6px}
  .m-events{margin-top:11px;border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:7px}
  .ev{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;line-height:1.3}
  .ev .edot{width:8px;height:8px;border-radius:50%;margin-top:2px;flex-shrink:0}
  .ev b{color:var(--ink);font-weight:700}
  .ev span{color:#6a7688}

  /* ---------- ACTIVITY TABLE ---------- */
  .activity{background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(26,46,74,.05);overflow:hidden}
  .activity table{width:100%;border-collapse:collapse;font-size:13px}
  .activity th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);background:#fafbfe;padding:11px 16px;border-bottom:1px solid var(--line)}
  .activity td{padding:13px 16px;border-bottom:1px solid var(--line);color:#3a4658;vertical-align:top}
  .activity tr:last-child td{border-bottom:none}
  .activity .sub{color:var(--grey);font-size:11.5px;margin-top:2px}

  /* ---------- RECIPIENTS ---------- */
  .recip-wrap{background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(26,46,74,.05);padding:20px}
  .recip{display:flex;flex-wrap:wrap;gap:12px}
  .recip-card{flex:1 1 180px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fbfcfe}
  .recip-card .rn{font-size:14px;font-weight:700;color:var(--ink)}
  .recip-card .rr{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--grey);margin-top:7px}
  .recip-note{font-size:12.5px;color:var(--grey);margin-top:14px;line-height:1.5}

  footer{margin:46px 0 40px;text-align:center;color:var(--grey);font-size:12.5px;line-height:1.9}
  footer .strong{color:var(--navy);font-weight:600}
  footer a{color:var(--blue);text-decoration:none}
  .foot-sep{width:46px;height:3px;background:var(--line);margin:0 auto 22px;border-radius:3px}

  @media(max-width:1000px){.kanban,.cal-grid{grid-template-columns:repeat(2,1fr)}.mg-5{grid-template-columns:repeat(3,1fr)}.mg-4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.twin-grid{grid-template-columns:1fr}.mg-3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.kanban,.cal-grid{grid-template-columns:1fr}.mg-3,.mg-4,.mg-5{grid-template-columns:1fr}}
  .d-capex{color:#b5532e;background:#fbe9e1}.d-resident{color:#0f7a3d;background:#e3f7ec}.d-people{color:#1a8a8a;background:#e0f7f7}
  .stats5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:820px){.stats5{grid-template-columns:repeat(2,1fr)}}
  .lock-sub{margin-bottom:30px}
  .lock-err2{color:#ff7b7b;font-size:13px;height:18px}
</style>
</head>

var TZ='America/New_York';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['S','M','T','W','T','F','S'];
var PHASE={};
var DOMAIN_LABEL={fin:'Accounting & Cash',capex:'CapEx / Make-ready',ops:'Maintenance',resident:'Residents & Leasing',owner:'Reporting & Compliance',people:'People'};
function set(id,t){var e=document.getElementById(id);if(e&&t!=null)e.textContent=t;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function parseDate(s){return new Date((s||'')+'T00:00:00-04:00');}
function fmtDate(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ});}
function fmtLong(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:TZ});}
function nowET(){var p={},parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());parts.forEach(function(x){p[x.type]=x.value;});return{y:+p.year,m:+p.month,d:+p.day};}

function switchTab(name){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('panel-'+name).classList.add('active');
  document.getElementById('tab-'+name+'-btn').classList.add('active');
  try{sessionStorage.setItem('zv_tab',name);}catch(e){}
}

function trackHtml(crossed,phases){var s={};(crossed||[]).forEach(function(k){s[k]=1;});return '<div class="track">'+phases.map(function(p){return '<i class="t" style="background:'+(s[p.key]?p.color:'#e7ebf2')+'"></i>';}).join('')+'</div>';}

function render(data){
  (data.phases||[]).forEach(function(p){PHASE[p.key]=p;});
  var board=data.board||[];
  var live=board.filter(function(a){return a.column==='prod'||a.column==='deploy';}).length;
  var test=board.filter(function(a){return a.column==='test';}).length;
  var road=board.filter(function(a){return a.column==='planned'||a.column==='dev';}).length;
  set('chip-live',live);set('chip-test',test);set('chip-road',road);
  set('stat-live',live);set('stat-building',test+road);
  var s=parseDate(data.planStart),e=parseDate(data.planEnd);
  set('chip-start',fmtDate(s));
  set('stat-days',Math.round((e-s)/86400000)+1);
  document.getElementById('legend').innerHTML=data.phases.map(function(p){return '<span class="lg"><span class="sw" style="background:'+p.color+'"></span>'+esc(p.label)+'</span>';}).join('');
  document.getElementById('kanban').innerHTML=data.columns.map(function(col){
    var cards=board.filter(function(a){return a.column===col.key;});
    var html=cards.map(function(a){
      var last=(a.crossed||[]).slice(-1)[0];var wc=(PHASE[last]||{}).color||col.color;
      return '<div class="kcard"><div class="kc-name">'+esc(a.name)+'</div><span class="kc-dom d-'+esc(a.domain)+'">'+esc(DOMAIN_LABEL[a.domain]||a.domain)+'</span><div class="kc-desc">'+esc(a.blurb)+'</div>'+trackHtml(a.crossed,data.phases)+'<div class="kc-when"><span class="dot" style="background:'+wc+'"></span>'+esc(a.when)+'</div></div>';
    }).join('')||'<div class="kc-desc" style="color:#98a4b6">—</div>';
    return '<div class="col'+(col.key==='prod'?' live':'')+'"><div class="col-head"><span class="col-title" style="color:'+col.color+'">'+esc(col.title)+'</span><span class="col-count">'+cards.length+'</span></div>'+html+'</div>';
  }).join('');

  var groups={};
  data.calendar.forEach(function(ev){var d=parseDate(ev.date);var k=d.getFullYear()+'-'+d.getMonth();(groups[k]=groups[k]||[]).push({day:d.getDate(),phase:ev.phase,title:ev.title,y:d.getFullYear(),m:d.getMonth()});});
  var keys=Object.keys(groups).sort(function(a,b){var A=a.split('-'),B=b.split('-');return(+A[0]*12+ +A[1])-(+B[0]*12+ +B[1]);});
  var t=nowET(),cur=t.y*12+(t.m-1);
  document.getElementById('calendar').innerHTML=keys.map(function(k){
    var evs=groups[k],y=evs[0].y,m=evs[0].m,idx=y*12+m;
    var first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),mark={};
    evs.forEach(function(x){mark[x.day]=x.phase;});
    var cells='';for(var i=0;i<first;i++)cells+='<div class="day"></div>';
    for(var d=1;d<=dim;d++){var ph=mark[d],isT=(y===t.y&&m===t.m-1&&d===t.d);cells+='<div class="day'+(ph?' mark':'')+(isT?' today':'')+'"'+(ph?' style="background:'+((PHASE[ph]||{}).color||'#7b8aa0')+'"':'')+'>'+d+'</div>';}
    var evHtml=evs.sort(function(a,b){return a.day-b.day;}).map(function(x){var c=(PHASE[x.phase]||{}).color||'#7b8aa0';return '<div class="ev"><span class="edot" style="background:'+c+'"></span><div><b>'+MONTHS[m].slice(0,3)+' '+x.day+'</b> — <span>'+esc(x.title)+'</span></div></div>';}).join('');
    var tag=idx<cur?'DONE':(idx===cur?'THIS MONTH':'PLANNED');
    return '<div class="month'+(idx>cur?' planned':'')+'"><div class="m-name">'+MONTHS[m]+' '+y+' <span class="m-tag">'+tag+'</span></div><div class="dow">'+DOW.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div><div class="days">'+cells+'</div><div class="m-events">'+evHtml+'</div></div>';
  }).join('');

  document.getElementById('needs').innerHTML=data.needs.map(function(n){return '<div class="recip-card" style="flex:1 1 240px"><div class="rn">'+esc(n[0])+'</div><div class="kc-desc" style="margin-top:8px;font-size:12.5px">'+esc(n[1])+'</div></div>';}).join('');
  document.getElementById('hist-body').innerHTML=data.history.slice().reverse().map(function(h){return '<tr><td style="white-space:nowrap">'+fmtLong(parseDate(h[0]))+'</td><td><b style="color:#1a2233">'+esc(h[1])+'</b><div class="sub">'+esc(h[2])+'</div></td></tr>';}).join('');
  try{var tb=sessionStorage.getItem('zv_tab');if(tb)switchTab(tb);}catch(e){}
}

// ---- PIN + decrypt: the dashboard body and data are AES-GCM encrypted with a key derived from the PIN
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pin){
  var raw=b64(BLOB),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
(function(){
  var lock=document.getElementById('lock'),app=document.getElementById('app'),row=document.getElementById('pinRow'),err=document.getElementById('pinErr');
  var boxes=Array.prototype.slice.call(row.querySelectorAll('.pin-box')),busy=false,KEY='zavala_portal_pin';
  function show(p){app.innerHTML=p.app;render(p.data);lock.classList.add('hidden');app.classList.add('show');}
  function fail(){err.classList.add('show');row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');boxes.forEach(function(b){b.value='';b.classList.remove('filled');});boxes[0].focus();try{sessionStorage.removeItem(KEY);}catch(e){}}
  async function attempt(pin,remember){if(busy)return;busy=true;try{var p=await unlock(pin);if(remember){try{sessionStorage.setItem(KEY,pin);}catch(e){}}err.classList.remove('show');show(p);}catch(e){fail();}busy=false;}
  try{var saved=sessionStorage.getItem(KEY);if(saved){attempt(saved,false);}}catch(e){}
  function current(){return boxes.map(function(b){return b.value;}).join('');}
  function check(){var v=current();if(v.length<6)return;attempt(v,true);}
  boxes.forEach(function(box,i){
    box.addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,1);this.classList.toggle('filled',this.value!=='');err.classList.remove('show');if(this.value&&i<boxes.length-1){boxes[i+1].focus();}if(current().length===6){check();}});
    box.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!this.value&&i>0){boxes[i-1].focus();boxes[i-1].value='';boxes[i-1].classList.remove('filled');e.preventDefault();}if(e.key==='Enter'){check();}});
    box.addEventListener('paste',function(e){e.preventDefault();var d=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0,6);boxes.forEach(function(b,j){b.value=d[j]||'';b.classList.toggle('filled',!!d[j]);});if(d.length>=6){check();}else if(d.length){boxes[Math.min(d.length,5)].focus();}});
  });
  setTimeout(function(){boxes[0].focus();},200);
})();
</script>
