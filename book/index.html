<!DOCTYPE html>

<head>

<!-- Open Graph — LinkedIn preview card -->
<meta property="og:type"        content="website" />

<meta property="og:title"       content="Book Your Free AI Operations Audit" />

<!-- Twitter card (LinkedIn also reads these as fallback) -->

<!-- Instant JS redirect (primary) -->
<script>window.location.replace("https://calendar.app.google/2juqXrLWWE2q441z6");</script>

<!-- Meta-refresh fallback (crawlers + no-JS) -->
<meta http-equiv="refresh" content="0; url=https://calendar.app.google/2juqXrLWWE2q441z6" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0B0F19;
    color: #E5E7EB;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 24px;
    text-align: center;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .logo span { color: #2ED3B7; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(46,211,183,0.2);
    border-top-color: #2ED3B7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    line-height: 1.3;
  }
  p {
    font-size: 15px;
    color: #9CA3AF;
    max-width: 380px;
    line-height: 1.6;
  }
  .btn {
    display: inline-block;
    margin-top: 8px;
    padding: 12px 28px;
    background: #2ED3B7;
    color: #0B0F19;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.88; }
  .footer-note {
    font-size: 12px;
    color: #4B5563;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Up<span>neX</span></div>
  <div class="spinner"></div>
  <h1>Redirecting to your booking page…</h1>
  <p>One moment — taking you to Hari's calendar to schedule your free 30-minute AI operations audit.</p>
  <a class="btn" href="https://calendar.app.google/2juqXrLWWE2q441z6">Book now &rarr;</a>
  <p class="footer-note">Not redirecting? <a href="https://calendar.app.google/2juqXrLWWE2q441z6" style="color:#2ED3B7;">Click here</a>.</p>
</div>
</body>
</html>
